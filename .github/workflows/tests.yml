name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # CONTRIBUTING.md requires Python 3.8+. actions/python-versions
          # publishes 3.8.18 for Ubuntu 24.04 but not for 26.04, which
          # ubuntu-latest uses from November 2026, so 3.8 is pinned to
          # ubuntu-24.04. actions/runner-images#14254 announces the
          # deprecation of the Ubuntu 22 based runner images.
          - os: ubuntu-24.04
            python-version: "3.8"
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Budget demo
        run: python examples/demo_budget.py
